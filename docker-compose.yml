services:
  web:
    build: .
    container_name: auth-web
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - auth-net

  db:
    image: mongo:7
    container_name: mongo-db
    volumes:
      - mongo-data:/data/db
    networks:
      - auth-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  auth-net:
    driver: bridge

volumes:
  mongo-data: