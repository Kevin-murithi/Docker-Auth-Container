name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Build (fast fail — no Docker)
  # ─────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint --if-present

      - name: Build
        run: npm run build
        env:
          MONGODB_URI: mongodb://placeholder:27017/build
          JWT_SECRET: build-placeholder

  # ─────────────────────────────────────────────
  # JOB 2: Smoke test (full stack via Compose)
  # ─────────────────────────────────────────────
  smoke-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        run: |
          echo "MONGODB_URI=mongodb://mongo-db:27017/ci_test" >> .env
          echo "JWT_SECRET=ci_secret" >> .env

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for app + test health
        run: |
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health || true)
            if [ "$CODE" = "200" ]; then
              echo "✅ App healthy"
              exit 0
            fi
            sleep 2
          done
          echo "❌ App never healthy"
          docker compose logs
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ─────────────────────────────────────────────
  # JOB 3: Publish (only on main, only if both pass)
  # ─────────────────────────────────────────────
  publish:
    runs-on: ubuntu-latest
    needs: [build, smoke-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max